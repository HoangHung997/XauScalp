name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore XauScalp.sln

      - name: Verify formatting
        run: dotnet format XauScalp.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build XauScalp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test XauScalp.sln --configuration Release --no-build --verbosity normal
