name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test offline XAU Native training pipeline
        run: python -m unittest discover -s research/training/tests -p "test_*.py"

      - name: Test feature evaluation and ablation pipeline
        run: python -m unittest discover -s research/feature-evaluation/tests -p "test_*.py"

      - name: Test demo readiness evidence gate
        run: python -m unittest discover -s research/demo-readiness/tests -p "test_*.py"


      - name: Restore
        run: dotnet restore XauScalp.sln

      - name: Verify formatting
        run: dotnet format XauScalp.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build XauScalp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test XauScalp.sln --configuration Release --no-build --verbosity normal

      - name: Generate XSP-017 CI rehearsal evidence
        run: python research/demo-readiness/generate_ci_rehearsal_evidence.py --output artifacts/xsp017-ci-rehearsal.json

      - name: Upload XSP-017 CI rehearsal evidence
        uses: actions/upload-artifact@v4
        with:
          name: xsp017-ci-rehearsal-evidence
          path: artifacts/xsp017-ci-rehearsal.json
          if-no-files-found: error
